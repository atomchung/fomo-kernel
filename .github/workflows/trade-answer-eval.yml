name: Trade answer eval interlocks

on:
  push:
    paths:
      - "evals/judge_trade_answers.py"
      - "evals/trade_answers/**"
      - "tests/test_trade_answer_judge.py"
      - ".github/workflows/trade-answer-eval.yml"
  pull_request:
    paths:
      - "evals/judge_trade_answers.py"
      - "evals/trade_answers/**"
      - "tests/test_trade_answer_judge.py"
      - ".github/workflows/trade-answer-eval.yml"

permissions:
  contents: read

jobs:
  offline-interlocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile judge adapter
        run: python3 -m py_compile evals/judge_trade_answers.py tests/test_trade_answer_judge.py
      - name: Verify witness bank and deterministic gate
        run: python3 tests/test_trade_answer_judge.py
      - name: Print opt-in judge plan without model calls
        run: python3 evals/judge_trade_answers.py --plan
