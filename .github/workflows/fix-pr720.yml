name: Apply PR 720 review corrections

on:
  push:
    branches:
      - codex/issue-629-repairable-recovery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-629-repairable-recovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          review = "skills/fomo-kernel/engine/review.py"
          consequence = "skills/fomo-kernel/engine/consequence.py"
          tests = "tests/test_consider.py"

          replace_once(
              review,
              '''        # Held instruments and benchmarks fail differently: unpriced holdings
        # remove P&L itself, unpriced benchmarks only remove the vs-market
        # segment. Saying which one is missing keeps the agent from treating an
        # optional enrichment as a blocker, or the reverse.
        blocking = bool(request.get("tickers"))
        scope = (f"the instruments in {request_path}.tickers — without them there is no "
                 "unrealized P&L or portfolio-level return" if blocking else
                 f"the benchmark symbols in {request_path}.benchmarks — holdings are "
                 "priced, but the benchmark comparison stays unavailable without them")
        status["next_action"] = (
            f"price coverage is incomplete for {scope}. Look those closes up in a recognized "
            "market-data source, transcribe them into the envelope documented in "
            f"references/price-feed.md, and rerun {command} with --prices <path>. Never invent a "
            "price, and never read a missing price as a delisting or as a zero return")
''',
              '''        # Held instruments, FX and benchmarks fail differently. Keep the
        # established close/benchmark wording byte-stable, but give an FX-only
        # repair its own exact instruction: an empty ticker list is not evidence
        # that a benchmark is missing (#629 review).
        missing_tickers = request.get("tickers") or []
        missing_currencies = request.get("currencies") or []
        if missing_currencies and not missing_tickers and not request.get("benchmarks"):
            status["next_action"] = (
                f"currency conversion coverage is incomplete for the FX rates in "
                f"{request_path}.currencies. Look up only those FX rates in a recognized "
                "market-data source, transcribe them into the `fx` block of the envelope "
                f"documented in references/price-feed.md, and rerun {command} with --prices "
                "<path>. Never invent a rate or treat a missing conversion as identity")
        else:
            blocking = bool(missing_tickers)
            scope = (f"the instruments in {request_path}.tickers — without them there is no "
                     "unrealized P&L or portfolio-level return" if blocking else
                     f"the benchmark symbols in {request_path}.benchmarks — holdings are "
                     "priced, but the benchmark comparison stays unavailable without them")
            status["next_action"] = (
                f"price coverage is incomplete for {scope}. Look those closes up in a recognized "
                "market-data source, transcribe them into the envelope documented in "
                f"references/price-feed.md, and rerun {command} with --prices <path>. Never invent a "
                "price, and never read a missing price as a delisting or as a zero return")
''')

          replace_once(
              review,
              '''    priced = {ticker for ticker in (last_px or {}) if ticker in set(requested)}
    unresolved_fx = [code for code in sorted(currencies or ())
                     if str(code).upper() != "USD" and code not in (fx or {})]
''',
              '''    priced = {ticker for ticker in (last_px or {}) if ticker in set(requested)}
    currency_set = {str(code).upper() for code in (currencies or ()) if code}
    # One native currency is self-consistent. FX is required only when the
    # consequence spans more than one currency; then every non-USD currency
    # needs its explicit USD-per-unit rate, matching consequence.portfolio_state.
    needs_conversion = len(currency_set) > 1
    unresolved_fx = [code for code in sorted(currency_set)
                     if needs_conversion and code != "USD" and code not in (fx or {})]
''')

          replace_once(
              review,
              '''        fx_mode=("not_needed" if not unresolved_fx and len(set(
            str(c).upper() for c in (currencies or ()))) <= 1 else
            ("feed" if agent_supplied else
             ("engine_fetch" if not unresolved_fx else "missing"))),
''',
              '''        fx_mode=("not_needed" if not needs_conversion else
            ("feed" if agent_supplied else
             ("engine_fetch" if not unresolved_fx else "missing"))),
''')

          replace_once(
              consequence,
              '''# ─────────────────────────────── validation ───────────────────────────────

def validate_premise(premise, rows):
''',
              '''# ─────────────────────────────── validation ───────────────────────────────

def premise_currency(premise, rows):
    """Return the normalized premise currency from the same rule validation uses.

    A supplied currency is validated directly. When omitted, a trade in an
    already-held ticker inherits that ticker's recorded currency; only a new
    ticker falls back to USD. Recovery calls this helper so it cannot invent a
    USD leg that the eventual normalized premise does not contain (#629).
    """
    if not isinstance(premise, dict):
        raise ConsequenceError("premise must be an object")
    ticker = _ticker(premise.get("ticker"))
    if premise.get("currency") is not None:
        return _currency(premise["currency"])
    cur_map, _currencies, _conflicts = trade_recap.currency_map(rows)
    return cur_map.get(ticker, "USD")


def validate_premise(premise, rows):
''')

          replace_once(
              consequence,
              '''    if premise.get("currency") is not None:
        currency = _currency(premise["currency"])
    else:
        cur_map, _currencies, _conflicts = trade_recap.currency_map(rows)
        currency = cur_map.get(ticker, "USD")
''',
              '''    currency = premise_currency(premise, rows)
''')

          replace_once(
              review,
              '''def _consider_recovery_tickers(rows, premise_ticker, _excluded_holdings=()):
''',
              '''def _consider_currency_universe(rows, premise_payload):
    """Currencies the actual before/after consequence can aggregate.

    ``rows`` is already scoped to usable current holdings. The premise currency
    comes from consequence.py's canonical normalization, so an omitted currency
    on a held ticker inherits the holding instead of injecting USD.
    """
    cur_map, _currencies, _conflicts = trade_recap.currency_map(rows or ())
    currencies = {str(code).upper() for code in cur_map.values() if code}
    currencies.add(consequence.premise_currency(premise_payload, rows or ()))
    return currencies


def _consider_recovery_tickers(rows, premise_ticker, _excluded_holdings=()):
''')

          replace_once(
              review,
              '''    premise_ticker = str(premise_payload.get("ticker") or "").strip()
    premise_currency = str(premise_payload.get("currency") or "USD").strip() or "USD"
    priced_universe = None
''',
              '''    premise_ticker = str(premise_payload.get("ticker") or "").strip()
    priced_universe = None
''')

          old_currency_block = '''        currencies = {row.get("currency") or "USD" for row in rows
                      if row.get("ticker") in priced_universe}
        if premise_ticker:
            currencies.add(premise_currency)
'''
          new_currency_block = '''        currencies = _consider_currency_universe(rows, premise_payload)
'''
          replace_once(review, old_currency_block, new_currency_block)

          replace_once(
              review,
              '''        currencies = {row.get("currency") or "USD" for row in current_rows}
        if premise_ticker:
            currencies.add(premise_currency)
''',
              '''        currencies = _consider_currency_universe(current_rows, premise_payload)
''')

          replace_once(
              tests,
              '''        assert kit["request"]["tickers"] == [], kit
        assert kit["request"]["currencies"] == ["TWD"], kit
        assert "ORPH" not in json.dumps(kit), kit
''',
              '''        assert kit["request"]["tickers"] == [], kit
        assert kit["request"]["currencies"] == ["TWD"], kit
        assert "ORPH" not in json.dumps(kit), kit
        action = kit["next_action"]
        assert "price_feed.request.currencies" in action, action
        assert "FX rate" in action, action
        assert "benchmark" not in action.lower(), action
        assert "close" not in action.lower(), action
''')

          replace_once(
              tests,
              '''def test_o_fx_only_orphan_regression_reddens_under_the_legacy_union_mutation():
''',
              '''def test_o_single_currency_twd_sell_inherits_currency_and_requests_no_fx():
    """One native currency needs no conversion, even when it is not USD."""
    with tempfile.TemporaryDirectory() as tmp:
        _write_ledger(os.path.join(tmp, "ledger.jsonl"), [
            _snapshot_event("2026-07-01", [
                {"ticker": "TWCO", "shares": 20, "avg_cost": 500.0,
                 "market": "TW", "currency": "TWD"},
            ]),
        ])
        prices = _fx_envelope(os.path.join(tmp, "twd.json"), {
            "TWCO": (550.0, "TWD"),
        })
        premise = '{"ticker": "TWCO", "side": "sell", "price": 550.0, "qty": 1}'
        result = _ok(_run("consider", "--root", tmp, "--prices", prices,
                          "--premise", premise))
        assert result["evaluation"]["premise"]["currency"] == "TWD"
        assert "request" not in (result.get("price_feed") or {}), result.get("price_feed")


def test_o_fx_only_orphan_regression_reddens_under_the_legacy_union_mutation():
''')
          PY
      - name: Install dependencies
        run: python -m pip install -r skills/fomo-kernel/requirements.txt
      - name: Verify focused and full suite
        run: |
          PYTHONPYCACHEPREFIX=/tmp/fomo629-pycache python tests/test_consider.py
          PYTHONPYCACHEPREFIX=/tmp/fomo629-pycache-full python tests/run_all.py
          git diff --check
      - name: Commit corrections and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/fix-pr720.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills/fomo-kernel/engine/review.py skills/fomo-kernel/engine/consequence.py tests/test_consider.py .github/workflows/fix-pr720.yml
          git commit -m "fix(consider): align FX recovery with canonical need"
          git push origin HEAD:codex/issue-629-repairable-recovery
